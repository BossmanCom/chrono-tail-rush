<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Chrono Tail Rush</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
  body {
    background: #0a0a12;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    height: 100dvh;
  }
  #gameCanvas {
    background: #111;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    max-width: 100vw;
    max-height: 100vh;
    max-height: 100dvh;
    border: 2px solid #333;
  }
  #ui {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 12px;
    font-size: 14px;
  }
  #scoreBoard {
    text-align: left;
    text-shadow: 0 0 4px #000;
  }
  #eraName {
    text-align: center;
    font-size: 16px;
    letter-spacing: 2px;
    text-shadow: 0 0 8px currentColor;
  }
  #controlsHint {
    text-align: center;
    opacity: 0.7;
    font-size: 12px;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui">
  <div id="scoreBoard">SCORE: 0</div>
  <div id="eraName">CLOUD ERA</div>
  <div id="controlsHint">SWIPE UP/DOWN • TAP TO BOOST</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreBoard = document.getElementById('scoreBoard');
const eraNameEl = document.getElementById('eraName');
const controlsHint = document.getElementById('controlsHint');

function resize() {
  const maxW = Math.min(window.innerWidth, 480);
  const maxH = Math.min(window.innerHeight, 720);
  canvas.width = maxW;
  canvas.height = maxH;
  canvas.style.width = maxW + 'px';
  canvas.style.height = maxH + 'px';
}
window.addEventListener('resize', resize);
resize();

const CHARACTERS = [
  {
    id: 'ani',
    name: 'ANI (FOXGIRL)',
    color: '#ff8c42',
    accent: '#2ecc71',
    jet: '#a855f7',
    earColor: '#c0392b',
    description: 'Your favorite troublemaker'
  },
  {
    id: 'catgirl',
    name: 'CAT GIRL',
    color: '#1a1a1a',
    accent: '#00ff88',
    jet: '#00ff88',
    earColor: '#ff3333',
    description: 'The one from the video'
  },
  {
    id: 'elf',
    name: 'RED ELF',
    color: '#1a6b4a',
    accent: '#e74c3c',
    jet: '#9b59b6',
    earColor: '#f5d0a9',
    description: 'Daphne style flyer'
  }
];

const ERAS = [
  { name: 'CLOUD ERA', bg: '#1a1a2e', accent: '#e0c3fc', island: '#4a4a6a', particle: '#ffffff' },
  { name: 'FEUDAL MIST', bg: '#1a120b', accent: '#f4d35e', island: '#5c4033', particle: '#ffd700' },
  { name: 'DIESEL TWILIGHT', bg: '#0d1b2a', accent: '#00b4d8', island: '#415a77', particle: '#90e0ef' },
  { name: 'NEON COLLAPSE', bg: '#0b0014', accent: '#ff00aa', island: '#2d004d', particle: '#00ffff' },
  { name: 'PRIMORDIAL', bg: '#0a1f0a', accent: '#7cfc00', island: '#2e4a1e', particle: '#adff2f' }
];

let state = 'SELECT';
let selectedChar = 0;
let score = 0;
let highScore = parseInt(localStorage.getItem('ctr_high') || '0');
let distance = 0;
let eraIndex = 0;
let eraTimer = 0;
let speed = 3.2;
let player = null;
let enemies = [];
let particles = [];
let islands = [];
let keys = {};
let touchY = null;
let boosting = false;
let boostTimer = 0;
let invuln = 0;
let frame = 0;

class Player {
  constructor(char) {
    this.char = char;
    this.x = canvas.width * 0.22;
    this.y = canvas.height * 0.5;
    this.w = 28;
    this.h = 36;
    this.vy = 0;
    this.trail = [];
  }
  update() {
    if (touchY !== null) {
      this.y += (touchY - this.y) * 0.18;
    } else {
      if (keys['ArrowUp'] || keys['w'] || keys['W']) this.vy -= 0.55;
      if (keys['ArrowDown'] || keys['s'] || keys['S']) this.vy += 0.55;
      this.vy *= 0.88;
      this.y += this.vy;
    }
    this.y = Math.max(20, Math.min(canvas.height - 40, this.y));
    if (boosting && boostTimer > 0) {
      boostTimer--;
      speed = Math.min(7.5, speed + 0.08);
    } else {
      boosting = false;
      speed = Math.max(3.2, speed - 0.04);
    }
    this.trail.unshift({ x: this.x - 8, y: this.y + 18, life: 12 });
    if (this.trail.length > 18) this.trail.pop();
    this.trail.forEach(t => t.life--);
  }
  draw() {
    const c = this.char;
    this.trail.forEach((t, i) => {
      if (t.life <= 0) return;
      ctx.globalAlpha = t.life / 14;
      ctx.fillStyle = c.jet;
      ctx.fillRect(t.x - i * 2, t.y - 3, 6 + i, 6);
    });
    ctx.globalAlpha = 1;
    ctx.fillStyle = c.color;
    ctx.fillRect(this.x, this.y, this.w, this.h);
    ctx.fillStyle = c.accent;
    if (c.id === 'ani') {
      ctx.fillRect(this.x + 4, this.y - 10, 6, 14);
      ctx.fillRect(this.x + 18, this.y - 10, 6, 14);
      ctx.fillStyle = c.earColor;
      ctx.fillRect(this.x + 2, this.y - 6, 5, 8);
      ctx.fillRect(this.x + 21, this.y - 6, 5, 8);
    } else if (c.id === 'catgirl') {
      ctx.fillStyle = c.earColor;
      ctx.fillRect(this.x + 3, this.y - 8, 6, 10);
      ctx.fillRect(this.x + 19, this.y - 8, 6, 10);
      ctx.fillStyle = c.accent;
      ctx.fillRect(this.x + 6, this.y + 6, 16, 4);
    } else {
      ctx.fillRect(this.x + 10, this.y - 12, 8, 16);
      ctx.fillStyle = c.earColor;
      ctx.fillRect(this.x - 2, this.y + 4, 4, 10);
      ctx.fillRect(this.x + this.w - 2, this.y + 4, 4, 10);
    }
    ctx.fillStyle = '#fff';
    ctx.fillRect(this.x + 7, this.y + 10, 4, 4);
    ctx.fillRect(this.x + 17, this.y + 10, 4, 4);
    ctx.fillStyle = '#111';
    ctx.fillRect(this.x + 8, this.y + 11, 2, 2);
    ctx.fillRect(this.x + 18, this.y + 11, 2, 2);
    ctx.fillStyle = c.jet;
    ctx.fillRect(this.x - 4, this.y + 20, 6, 10);
    ctx.fillRect(this.x + this.w - 2, this.y + 20, 6, 10);
  }
}

class Enemy {
  constructor(type) {
    this.type = type;
    this.x = canvas.width + 40;
    this.y = 40 + Math.random() * (canvas.height - 100);
    this.w = type === 'troll' ? 42 : 26;
    this.h = type === 'troll' ? 48 : 30;
    this.speed = speed * (0.7 + Math.random() * 0.6);
    this.vy = (Math.random() - 0.5) * 1.8;
    this.wobble = Math.random() * Math.PI * 2;
  }
  update() {
    this.x -= this.speed + speed * 0.3;
    this.y += this.vy;
    this.wobble += 0.08;
    if (this.type === 'claw') this.y += Math.sin(this.wobble) * 1.4;
    if (this.y < 20 || this.y > canvas.height - 50) this.vy *= -1;
  }
  draw() {
    const era = ERAS[eraIndex];
    if (this.type === 'troll') {
      ctx.fillStyle = '#3d2b1f';
      ctx.fillRect(this.x, this.y, this.w, this.h);
      ctx.fillStyle = era.accent;
      ctx.fillRect(this.x + 6, this.y + 8, 30, 8);
      ctx.fillStyle = '#888';
      ctx.fillRect(this.x - 10, this.y + 12, 14, 6);
    } else {
      ctx.fillStyle = '#111';
      ctx.fillRect(this.x, this.y, this.w, this.h);
      ctx.fillStyle = era.accent;
      ctx.fillRect(this.x + 4, this.y + 4, 18, 6);
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(this.x + 2, this.y - 6, 5, 8);
      ctx.fillRect(this.x + 17, this.y - 6, 5, 8);
      if (this.type === 'claw') {
        ctx.fillStyle = '#eee';
        ctx.fillRect(this.x - 8, this.y + 10, 10, 3);
        ctx.fillRect(this.x + this.w - 2, this.y + 10, 10, 3);
      }
    }
  }
}

function spawnParticles(x, y, color, count = 8) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6,
      life: 20 + Math.random() * 15,
      color
    });
  }
}

function spawnIsland() {
  islands.push({
    x: canvas.width + 50,
    y: 30 + Math.random() * (canvas.height - 120),
    w: 60 + Math.random() * 80,
    h: 20 + Math.random() * 30,
    speed: 0.6 + Math.random() * 0.8
  });
}

window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'Enter') {
    if (state === 'SELECT') startGame();
    else if (state === 'PLAYING') { boosting = true; boostTimer = 25; }
    else if (state === 'GAMEOVER') { state = 'SELECT'; }
  }
  if (state === 'SELECT') {
    if (e.key === 'ArrowLeft' || e.key === 'a') selectedChar = (selectedChar + 2) % 3;
    if (e.key === 'ArrowRight' || e.key === 'd') selectedChar = (selectedChar + 1) % 3;
  }
});
window.addEventListener('keyup', e => keys[e.key] = false);

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  const y = (t.clientY - rect.top) * (canvas.height / rect.height);
  const tx = (t.clientX - rect.left) * (canvas.width / rect.width);

  if (state === 'SELECT') {
    const third = canvas.width / 3;
    let tapped = 0;
    if (tx < third) tapped = 0;
    else if (tx < third * 2) tapped = 1;
    else tapped = 2;

    // Second tap on the same character starts the game
    if (tapped === selectedChar) {
      startGame();
    } else {
      selectedChar = tapped;
    }
  } else if (state === 'PLAYING') {
    touchY = y;
    boosting = true;
    boostTimer = 22;
  } else if (state === 'GAMEOVER') {
    state = 'SELECT';
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (state !== 'PLAYING') return;
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  touchY = (t.clientY - rect.top) * (canvas.height / rect.height);
}, { passive: false });

canvas.addEventListener('touchend', () => { touchY = null; });

function startGame() {
  state = 'PLAYING';
  score = 0;
  distance = 0;
  eraIndex = 0;
  eraTimer = 0;
  speed = 3.2;
  enemies = [];
  particles = [];
  islands = [];
  invuln = 60;
  player = new Player(CHARACTERS[selectedChar]);
  for (let i = 0; i < 4; i++) spawnIsland();
  controlsHint.textContent = 'SWIPE TO FLY • TAP TO BOOST';
}

function gameOver() {
  state = 'GAMEOVER';
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('ctr_high', highScore);
  }
  controlsHint.textContent = 'TAP TO RETURN TO SELECT';
}

function loop() {
  frame++;
  const era = ERAS[eraIndex];
  ctx.fillStyle = era.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (state === 'SELECT') {
    drawSelect();
  } else if (state === 'PLAYING') {
    updatePlaying();
    drawPlaying();
  } else {
    drawPlaying();
    drawGameOver();
  }
  requestAnimationFrame(loop);
}

function drawSelect() {
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 28px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('CHRONO TAIL RUSH', canvas.width / 2, 70);
  ctx.font = '14px Courier New';
  ctx.fillStyle = '#aaa';
  ctx.fillText('PICK YOUR PILOT', canvas.width / 2, 100);

  const cardW = canvas.width * 0.28;
  const startX = canvas.width * 0.08;
  const gap = canvas.width * 0.04;

  CHARACTERS.forEach((c, i) => {
    const x = startX + i * (cardW + gap);
    const y = canvas.height * 0.28;
    const selected = i === selectedChar;
    ctx.fillStyle = selected ? '#222' : '#151515';
    ctx.fillRect(x, y, cardW, 220);
    ctx.strokeStyle = selected ? c.accent : '#333';
    ctx.lineWidth = selected ? 3 : 1;
    ctx.strokeRect(x, y, cardW, 220);

    ctx.save();
    ctx.translate(x + cardW / 2 - 14, y + 70);
    ctx.fillStyle = c.color;
    ctx.fillRect(0, 0, 28, 36);
    ctx.fillStyle = c.accent;
    if (c.id === 'ani') {
      ctx.fillRect(4, -10, 6, 14);
      ctx.fillRect(18, -10, 6, 14);
    } else if (c.id === 'catgirl') {
      ctx.fillStyle = '#ff3333';
      ctx.fillRect(3, -8, 6, 10);
      ctx.fillRect(19, -8, 6, 10);
    } else {
      ctx.fillRect(10, -12, 8, 16);
    }
    ctx.restore();

    ctx.fillStyle = selected ? c.accent : '#ccc';
    ctx.font = 'bold 12px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(c.name, x + cardW / 2, y + 160);
    ctx.font = '10px Courier New';
    ctx.fillStyle = '#888';
    ctx.fillText(c.description, x + cardW / 2, y + 180);
  });

  ctx.fillStyle = '#fff';
  ctx.font = '14px Courier New';
  ctx.fillText('TAP CHARACTER TO SELECT', canvas.width / 2, canvas.height - 55);
  ctx.fillStyle = '#7cfc00';
  ctx.font = 'bold 15px Courier New';
  ctx.fillText('TAP THE SAME ONE AGAIN TO START', canvas.width / 2, canvas.height - 30);
  ctx.fillStyle = '#666';
  ctx.font = '11px Courier New';
  ctx.fillText('HIGH SCORE: ' + highScore, canvas.width / 2, canvas.height - 10);
}

function updatePlaying() {
  player.update();
  distance += speed;
  score = Math.floor(distance / 8);

  eraTimer++;
  if (eraTimer > 900) {
    eraTimer = 0;
    eraIndex = (eraIndex + 1) % ERAS.length;
    spawnParticles(canvas.width / 2, canvas.height / 2, ERAS[eraIndex].accent, 30);
  }
  eraNameEl.textContent = ERAS[eraIndex].name;
  eraNameEl.style.color = ERAS[eraIndex].accent;

  if (frame % 55 === 0) {
    const r = Math.random();
    let type = 'cat';
    if (r > 0.72) type = 'troll';
    else if (r > 0.45) type = 'claw';
    enemies.push(new Enemy(type));
  }
  if (frame % 90 === 0) spawnIsland();

  enemies.forEach(e => e.update());
  enemies = enemies.filter(e => e.x > -60);
  islands.forEach(i => i.x -= i.speed + speed * 0.25);
  islands = islands.filter(i => i.x > -120);
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
  particles = particles.filter(p => p.life > 0);

  if (invuln > 0) invuln--;
  else {
    for (let e of enemies) {
      if (player.x < e.x + e.w && player.x + player.w > e.x &&
          player.y < e.y + e.h && player.y + player.h > e.y) {
        spawnParticles(player.x + 14, player.y + 18, player.char.jet, 20);
        gameOver();
        break;
      }
      const dx = (player.x + player.w/2) - (e.x + e.w/2);
      const dy = (player.y + player.h/2) - (e.y + e.h/2);
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 55 && dist > 30 && frame % 8 === 0) {
        score += 15;
        spawnParticles(e.x, e.y, '#fff', 3);
      }
    }
  }
  scoreBoard.textContent = `SCORE: ${score}   HI: ${highScore}`;
}

function drawPlaying() {
  const era = ERAS[eraIndex];
  islands.forEach(i => {
    ctx.fillStyle = era.island;
    ctx.fillRect(i.x, i.y, i.w, i.h);
    ctx.fillRect(i.x + 10, i.y - 18, 8, 18);
    ctx.fillRect(i.x + i.w - 20, i.y - 12, 6, 12);
  });
  particles.forEach(p => {
    ctx.globalAlpha = p.life / 30;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 3, 3);
  });
  ctx.globalAlpha = 1;
  enemies.forEach(e => e.draw());
  if (player) {
    if (!(invuln > 0 && frame % 4 < 2)) player.draw();
  }
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#ff4466';
  ctx.font = 'bold 32px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('CRASHED', canvas.width / 2, canvas.height / 2 - 40);
  ctx.fillStyle = '#fff';
  ctx.font = '18px Courier New';
  ctx.fillText('SCORE: ' + score, canvas.width / 2, canvas.height / 2 + 10);
  ctx.fillStyle = '#aaa';
  ctx.font = '14px Courier New';
  ctx.fillText('HIGH: ' + highScore, canvas.width / 2, canvas.height / 2 + 40);
  ctx.fillStyle = '#fff';
  ctx.fillText('TAP TO PICK AGAIN', canvas.width / 2, canvas.height / 2 + 90);
}

loop();
</script>
</body>
</html>
